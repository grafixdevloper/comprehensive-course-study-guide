<!-- Cover Page Component -->
<template id="cover-template">
  <section class="page cover-page">
    <div class="cover-content">
      <div class="cover-header">
        <span class="cover-label">COMPREHENSIVE STUDY GUIDE</span>
      </div>
      <h1 class="cover-title">{{course_name}}</h1>
      <p class="cover-subtitle">{{subtitle}}</p>

      <div class="cover-divider">
        <svg width="200" height="4" viewBox="0 0 200 4">
          <line x1="0" y1="2" x2="200" y2="2" stroke="var(--color-primary)" stroke-width="2"/>
          <circle cx="100" cy="2" r="3" fill="var(--color-primary)"/>
        </svg>
      </div>

      <div class="cover-meta">
        <dl class="meta-list">
          <dt>Syllabus Coverage</dt>
          <dd>{{syllabus_covered}}</dd>

          <dt>Academic Term</dt>
          <dd>{{academic_term}}</dd>

          <dt>Generated</dt>
          <dd>{{generation_date}}</dd>

          {{#if pyq_available}}
          <dt>Previous-Year Papers Analyzed</dt>
          <dd>{{papers_analyzed}} papers ({{years_range}})</dd>
          {{else}}
          <dt class="warning">No PYQ Data</dt>
          <dd class="warning">Priorities derived from course materials only</dd>
          {{/if}}
        </dl>
      </div>

      <div class="cover-footer">
        <p class="disclaimer">{{disclaimer}}</p>
      </div>
    </div>
  </section>
</template>

<style>
  .cover-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    padding: 4rem;
    background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
    color: white;
    position: relative;
    overflow: hidden;
  }

  .cover-page::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.03) 0%, transparent 50%);
    pointer-events: none;
  }

  .cover-content {
    position: relative;
    z-index: 1;
    max-width: 600px;
  }

  .cover-label {
    display: inline-block;
    font-family: var(--font-family-sans);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-bold);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.7);
    margin-bottom: var(--space-lg);
    padding: var(--space-xs) var(--space-md);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--border-radius-md);
  }

  .cover-title {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: var(--font-weight-bold);
    line-height: 1.1;
    margin: 0 0 var(--space-md);
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .cover-subtitle {
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: var(--font-weight-normal);
    color: rgba(255,255,255,0.9);
    margin: 0 0 var(--space-xl);
    font-family: var(--font-family-serif);
    font-style: italic;
  }

  .cover-divider {
    margin: var(--space-xl) 0;
    opacity: 0.6;
  }

  .meta-list {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--space-sm) var(--space-lg);
    text-align: left;
    max-width: 400px;
    margin: 0 auto var(--space-xl);
    font-size: var(--font-size-base);
  }

  .meta-list dt {
    color: rgba(255,255,255,0.6);
    font-weight: var(--font-weight-medium);
  }

  .meta-list dd {
    color: white;
    font-weight: var(--font-weight-normal);
    margin: 0;
  }

  .meta-list .warning {
    color: #ffd700;
  }

  .cover-footer {
    margin-top: var(--space-2xl);
    padding-top: var(--space-xl);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .disclaimer {
    font-size: var(--font-size-sm);
    color: rgba(255,255,255,0.5);
    font-style: italic;
    max-width: 500px;
    margin: 0 auto;
    line-height: var(--line-height-relaxed);
  }

  @media print {
    .cover-page {
      min-height: 297mm;
      background: var(--color-primary-dark) !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .cover-title { font-size: 36pt; }
    .cover-subtitle { font-size: 18pt; }
    .meta-list { font-size: 12pt; }
    .disclaimer { font-size: 10pt; }
  }
</style>
